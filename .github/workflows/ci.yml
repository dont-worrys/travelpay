# PR과 dev·main 반영마다 빌드·테스트를 돌립니다. AWS 권한·비밀값은 쓰지 않습니다(배포는 별도 워크플로).
# 액션은 공급망 변조를 막기 위해 검토한 커밋 SHA로 고정합니다(주석은 그 커밋의 릴리스 태그).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 저장소를 읽기만 합니다. 외부 저장소에서 온 PR이 실행돼도 쓸 수 있는 권한이 없습니다.
permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 실행을 멈추고, dev·main 반영 실행은 끝까지 둡니다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle:
    name: Gradle build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Gradle wrapper 검증과 의존성 캐시를 맡습니다. 캐시는 기본 브랜치(dev)에서만 쓰고 PR에서는 읽기만 합니다.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # 서비스 통합 테스트가 Testcontainers로 Docker를 씁니다. GitHub 실행기에는 Docker가 있습니다.
      - run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-test-reports
          path: "*/build/reports/tests/"
          retention-days: 7
          if-no-files-found: ignore

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # infra/aws/versions.tf의 required_version과 같아야 합니다.
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/aws
      # State와 AWS 자격 증명 없이 검사합니다. 테스트는 모의 provider만 쓰고, Git에서 제외한 입력 파일도 없습니다.
      - name: Main root
        working-directory: infra/aws
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: State bootstrap root
        working-directory: infra/aws/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Data·앱 호스트(AL2023)의 python3이 3.9입니다. 호스트에서 도는 스크립트는 이 버전에서 동작해야 합니다.
          # DB 초기화 SQL은 실제 PostgreSQL로 권한 경계를 검사합니다.
          - python: "3.9"
            postgres: "1"
          # 인프라 담당자 PC에서 도는 도구(비밀값 준비·이미지 게시)는 최신 버전으로도 확인합니다.
          - python: "3.15"
            postgres: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # 테스트는 이미지를 받지 않고(--pull=never) 미리 받은 고정 이미지만 씁니다.
      - name: Pull PostgreSQL image
        if: matrix.postgres == '1'
        run: docker pull postgres:18.6-bookworm
      - name: Unit tests
        working-directory: infra/aws
        env:
          TRAVELPAY_TEST_POSTGRES: ${{ matrix.postgres }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
