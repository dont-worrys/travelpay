# main에 반영된 커밋을 운영 ECS에 배포합니다. 같은 커밋으로 CI를 먼저 돌리고, 통과하면 이미지 내용이 바뀐 서비스만
# 이미지를 만들어 다른 서비스가 호출하는 서비스부터 하나씩 롤링 배포합니다(infra/aws/scripts/deploy-services.py).
name: CD

on:
  push:
    branches: [main]
  # 실패한 배포를 다시 하거나 Terraform이 바꾼 Task 설정을 반영할 때 씁니다. production 환경이 main에서만 실행을 허용합니다.
  workflow_dispatch:
    inputs:
      services:
        description: "바뀌지 않았어도 다시 배포할 서비스 키(쉼표로 구분, 예: user,gateway). 비우면 바뀐 서비스만 배포합니다."
        type: string
        default: ""

permissions: {}

# 배포는 한 번에 하나만 돌고 진행 중인 배포를 끊지 않습니다. 기다리는 실행은 더 새 실행으로 바뀌지만, 배포 대상은
# 실행 중인 이미지와 비교해 고르므로 건너뛴 커밋의 변경도 다음 실행에 들어갑니다(서비스를 지정한 수동 실행은 다시 실행).
# 그룹을 브랜치별로 나눠 main 외의 브랜치에서 실수로 실행해도 대기 중인 main 배포를 밀어내지 않습니다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # main 외의 브랜치에서 수동 실행하면 아무것도 하지 않습니다(production 환경도 main만 허용).
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    name: Plan
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      # 실행 중 이미지의 소스 커밋과 비교하려면 전체 기록이 필요합니다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # 공개 저장소라 로그를 누구나 봅니다. 역할 ARN은 환경 비밀값으로 두고 계정 ID는 로그에서 가립니다.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true
      - id: plan
        env:
          FORCE_SERVICES: ${{ inputs.services }}
        run: |
          services="$(python infra/aws/scripts/deploy-services.py plan --force="$FORCE_SERVICES")"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  # 서비스별 이미지를 동시에 만들어 커밋 태그로 ECR에 올립니다. 배포 단계는 같은 태그로 이미지를 찾습니다.
  build:
    name: Build ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true
      - env:
          SERVICE: ${{ matrix.service }}
        run: python infra/aws/scripts/deploy-services.py build --service "$SERVICE"

  # 호출되는 서비스의 배포가 끝난 뒤 호출하는 서비스를 배포하도록 하나씩 배포합니다. 롤링 중에는 이전·새 Task가 함께 떠서
  # 8개를 한꺼번에 하면 앱 호스트의 남는 메모리도 넘습니다. 한 서비스가 실패하거나 시간 안에 끝나지 않으면 뒤의 서비스는
  # 배포하지 않고, 다음 실행이 그 서비스를 다시 대상으로 잡습니다.
  deploy:
    name: Deploy
    needs: [plan, build]
    runs-on: ubuntu-24.04
    # 서비스당 최대 20분을 기다리며, AWS 자격 증명(1시간)이 끝나기 전에 멈춥니다.
    timeout-minutes: 55
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # 서비스마다 배포 직전에 실행 중 이미지가 이 커밋보다 새 커밋에서 나왔는지 다시 확인합니다(이전 실행의 다시 실행 방지).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true
      # 서비스를 지정한 수동 실행이면 같은 리비전이어도 새 배포로 Task를 다시 띄웁니다(바꾼 SSM 비밀값은 새 Task부터 반영).
      - env:
          SERVICES: ${{ needs.plan.outputs.services }}
          FORCE_SERVICES: ${{ inputs.services }}
        run: python infra/aws/scripts/deploy-services.py deploy --services "$SERVICES" --force="$FORCE_SERVICES"
