# TRAVELPAY 로컬 모니터링 환경
# 기존 개발 인프라와 별도 Compose 프로젝트로 관리합니다.
name: travelpay-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=72h
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.6.20
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # .gitkeep으로 체크아웃할 때 생성합니다. Docker의 root 소유 폴더 자동 생성은 막습니다.
      - type: bind
        source: ./infra/monitoring/.local-logs
        target: /var/log/travelpay
        read_only: true
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # 사용하는 설정만 마운트해 이미지의 기본 plugins 폴더를 유지합니다.
      - ./infra/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
