name: travelpay-local

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      USER_DB_USERNAME: ${USER_DB_USERNAME:?required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?required}
      WALLET_DB_USERNAME: ${WALLET_DB_USERNAME:?required}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?required}
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:?required}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?required}
      EXCHANGE_DB_USERNAME: ${EXCHANGE_DB_USERNAME:?required}
      EXCHANGE_DB_PASSWORD: ${EXCHANGE_DB_PASSWORD:?required}
      LEDGER_DB_USERNAME: ${LEDGER_DB_USERNAME:?required}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      MOCK_BANK_DB_USERNAME: ${MOCK_BANK_DB_USERNAME:?required}
      MOCK_BANK_DB_PASSWORD: ${MOCK_BANK_DB_PASSWORD:?required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis-session:
    image: ${REDIS_IMAGE:-redis:8.2.11-bookworm}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_SESSION_PASSWORD:?required}
    environment:
      REDISCLI_AUTH: ${REDIS_SESSION_PASSWORD:?required}
    ports:
      - "127.0.0.1:${REDIS_SESSION_PORT:-16379}:6379"
    volumes:
      - ./infra/redis/session/redis.conf:/usr/local/etc/redis/redis.conf:ro,Z
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis-cache:
    image: ${REDIS_IMAGE:-redis:8.2.11-bookworm}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:?required}
    environment:
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD:?required}
    ports:
      - "127.0.0.1:${REDIS_CACHE_PORT:-16380}:6379"
    volumes:
      - ./infra/redis/cache/redis.conf:/usr/local/etc/redis/redis.conf:ro,Z
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------- Kafka (KRaft 단일 노드) ----------
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.2.2}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-YpPuKnjuGLYUqVLlmxun8Q}
      # PLAINTEXT = 컨테이너끼리(kafka:29092) / PLAINTEXT_HOST = 로컬 IDE 앱(localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 브로커가 1대라 내부 토픽 복제 수를 1로 맞춤 (기본값 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 각 서비스에서 NewTopic 빈으로 선언 (이름 규칙: 서비스.대상.이벤트)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------- Kafka-UI ----------
  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-kafbat/kafka-ui:v1.5.0}
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8989}:8080"   # 8080은 게이트웨이용으로 비워 둠
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
