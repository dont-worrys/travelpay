# TRAVELPAY 운영 Loki 설정입니다. 로컬 설정과 달리 로그를 CloudWatch와 같은 7일 동안 보관하고,
# Grafana Labs로 사용 통계를 보내지 않습니다. 인증은 쓰지 않으며 SG가 수집기 호스트의 접근만 허용합니다.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
