# TRAVELPAY 로컬 Grafana 데이터소스 설정
apiVersion: 1

datasources:
  # Prometheus - 애플리케이션 및 인프라 메트릭 조회
  - name: Prometheus
    uid: prometheus-local
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Loki - 애플리케이션 및 Docker 로그 조회
  - name: Loki
    uid: loki-local
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: Trace ID
          matcherRegex: '"traceId"\s*:\s*"([a-f0-9]{32})"'
          url: '/d/travelpay-local-perf?var-service=$$__all&var-api=$$__all&var-status=$$__all&var-traceId=$${__value.raw}&from=$${__from}&to=$${__to}'
          urlDisplayLabel: 같은 요청 로그 보기
