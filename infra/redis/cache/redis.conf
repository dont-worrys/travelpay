# 환전 서비스용입니다: 환율 캐시(DB에 원본이 있는 복사본) + 견적 저장소(여기에만 있는 원본, #223).
# 메모리가 가득 차도 키를 지우지 않고 새로 쓰는 것만 거절합니다(noeviction).
# - 견적은 다시 만들 수 없어, 메모리가 찼다고 유효한 견적을 조용히 지우면 사용자가 신청할 때 "견적 없음"이 됩니다.
# - 환율 캐시 쓰기가 거절되면 환율은 DB에서 읽으므로 느려질 뿐 결과는 같습니다.
# - 모든 키에 유효 시간(환율 30초, 견적 10분)이 있어 지우지 않아도 메모리는 스스로 비워집니다.
#   견적 1건이 약 500바이트라 128MB면 초당 약 400건이 10분 동안 계속 발급돼야 찹니다.
maxmemory 128mb
maxmemory-policy noeviction
protected-mode yes

# 견적은 몇 분짜리라 디스크에 저장하지 않습니다. Redis가 재시작되면 아직 쓰지 않은 견적은 사라지고 다시 받습니다.
save ""
appendonly no
