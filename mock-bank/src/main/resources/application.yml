spring:
  application:
    name: mock-bank
  datasource:
    url: ${MOCK_BANK_DB_URL}
    username: ${MOCK_BANK_DB_USERNAME}
    password: ${MOCK_BANK_DB_PASSWORD}
  flyway:
    default-schema: mock_bank
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
