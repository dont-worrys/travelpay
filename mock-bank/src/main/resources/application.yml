spring:
  application:
    name: mock-bank
  datasource:
    url: ${MOCK_BANK_DB_URL}
    username: ${MOCK_BANK_DB_USERNAME}
    password: ${MOCK_BANK_DB_PASSWORD}
  flyway:
    default-schema: mock_bank
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8090

# Mock-Fault: DELAY 헤더로 처리·커밋 후 응답을 늦추는 시간
mock-bank:
  fault:
    delay: 10s

management:
  metrics:
    distribution:
      percentiles-histogram:
        # Prometheus에서 HTTP p95·p99를 계산할 수 있도록 bucket을 발행합니다.
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  # IntelliJ 작업 디렉터리는 프로젝트 루트입니다. Alloy가 앱별 파일을 읽습니다.
  file:
    name: infra/monitoring/.local-logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 50MB
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: ${spring.application.name}
