spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: payment_service
  cloud:
    openfeign:
      client:
        config:
          wallet-service:
            connect-timeout: 2000
            read-timeout: 3000

travelpay:
  auth:
    header-context:
      enabled: true

server:
  port: 8080

eureka:
  instance:
    hostname: payment-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
