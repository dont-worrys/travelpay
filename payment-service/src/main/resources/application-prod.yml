spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      data-source-properties:
        # JDBC 배치 INSERT를 여러 행 INSERT 한 문장으로 바꿔 보냄 (PostgreSQL 드라이버)
        reWriteBatchedInserts: true
  # 송금 복구·결제 정산 복구 스케줄러가 서로의 원장 호출(건당 최대 약 6초)을 기다리지 않도록 스레드를 나눕니다. (결제 담당자 합의)
  task:
    scheduling:
      pool:
        size: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 정산 항목처럼 여러 건을 한 번에 저장할 때 DB 왕복을 줄이도록 묶어서 보냄
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    default-schema: payment_service
  cloud:
    openfeign:
      client:
        config:
          # 결제·송금이 함께 쓰는 Feign 클라이언트(contextId 기준)
          paymentWalletApi:
            connect-timeout: 2000
            read-timeout: 3000
          # 원장 최대 응답(약 5초)보다 길게 기다리고, 넘으면 결과 모름(송금은 PROCESSING)
          paymentLedgerApi:
            connect-timeout: 1000
            read-timeout: 6000
          paymentUserApi:
            connect-timeout: 2000
            read-timeout: 3000

travelpay:
  auth:
    header-context:
      enabled: true

server:
  port: 8080

# 운영에서는 API 문서를 노출하지 않습니다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

eureka:
  instance:
    hostname: payment-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
