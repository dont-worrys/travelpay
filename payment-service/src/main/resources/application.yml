spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: payment_service
  cloud:
    openfeign:
      client:
        config:
          wallet-service:
            connect-timeout: 2000
            read-timeout: 3000
          user-service:
            connect-timeout: 2000
            read-timeout: 3000
          # 송금 원장 거래 등록 (contextId로 설정 키가 나뉨). 원장 최대 응답(약 5초)보다 길게 기다리고, 넘으면 결과 모름으로 PROCESSING
          transfer-ledger:
            connect-timeout: 1000
            read-timeout: 6000
          # 송금 쪽 Wallet 클라이언트와 중복이라 공통화 리팩토링 때 정리할 예정입니다.
          paymentWalletApi:
            connect-timeout: 2000
            read-timeout: 3000

travelpay:
  auth:
    header-context:
      enabled: true

server:
  port: 8083

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
