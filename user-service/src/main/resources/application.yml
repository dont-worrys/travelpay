spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
  flyway:
    # 테이블과 초기 약관은 db/migration의 Flyway 파일이 만듭니다.
    default-schema: user_service
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate는 테이블을 만들거나 바꾸지 않고, 엔티티와 맞는지 검사만 합니다.
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_SESSION_HOST:localhost}
      port: ${REDIS_SESSION_PORT:16379}
      password: ${REDIS_SESSION_PASSWORD}
      # 각 Redis 연결·명령의 대기 상한입니다. 전체 HTTP 요청 시간 제한과는 다릅니다.
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  session:
    # 마지막 세션 접근 후 60분간 사용하지 않으면 만료됩니다.
    timeout: 60m
    data:
      redis:
        namespace: travelpay:user:session

travelpay:
  auth:
    header-context:
      # User에서는 회원 헤더로 요청자 정보를 만들지 않습니다.
      enabled: false
  user:
    session:
      # 로그인 시각부터 24시간이 지나면 사용 중이어도 다시 로그인해야 합니다.
      absolute-timeout: 24h
    password-change:
      # 해시 연산을 제외한 각 DB 작업·잠금 대기의 트랜잭션 제한 시간입니다.
      transaction-timeout: ${USER_PASSWORD_CHANGE_TRANSACTION_TIMEOUT:5s}
    admin:
      # 관리자 API(회원 정지·해제·세션 종료·검색, 약관 등록·조회)의 각 DB 작업·잠금 대기 제한 시간입니다.
      transaction-timeout: ${USER_ADMIN_TRANSACTION_TIMEOUT:5s}
    login-attempt:
      # 같은 이메일+IP로 window 안에 pair-limit번 실패하면 block 동안 로그인을 막습니다.
      pair-limit: 5
      # 같은 이메일로 IP와 관계없이 window 안에 account-limit번 실패하면 block 동안 로그인을 막습니다.
      account-limit: 20
      window: 10m
      block: 20m
    recipient-lookup:
      # 수취인 조회 제한의 요청자별 허용 횟수와 집계 기간입니다.
      limit: ${USER_RECIPIENT_LOOKUP_LIMIT:60}
      period: ${USER_RECIPIENT_LOOKUP_PERIOD:60s}

server:
  port: 8081
  # Gateway의 8KiB 수신 한도에 내부 헤더가 추가될 여유를 둡니다.
  max-http-request-header-size: 16KB
  # Gateway가 보낸 Client-Ip(실제 클라이언트 IP)를 클라이언트 주소로 씀. 내부 대역에서 온 요청만 해당
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: Client-Ip
  servlet:
    session:
      cookie:
        name: SESSION
        path: /
        http-only: true
        same-site: lax
        secure: false

# API 문서(Swagger UI: /swagger-ui.html). 외부 API만 그룹으로 노출하며 prod에서는 끕니다.
springdoc:
  api-docs:
    enabled: true
  # 그룹 없는 전체 문서(/v3/api-docs)는 내부 API까지 담으므로 만들지 않습니다.
  enable-default-api-docs: false
  # 응답 형식을 */* 대신 실제 형식(JSON)으로 표시합니다.
  default-produces-media-type: application/json
  swagger-ui:
    enabled: true
    # 처음 열 때 보여 줄 그룹입니다. springdoc은 그룹을 표시 이름순으로 나열해 관리 그룹이 먼저 옵니다.
    urls-primary-name: 회원·인증
    # 묶음은 이름순, API는 경로순으로 보여 줍니다.
    tags-sorter: alpha
    operations-sorter: alpha

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  metrics:
    distribution:
      percentiles-histogram:
        # Prometheus에서 HTTP p95·p99를 계산할 수 있도록 bucket을 발행합니다.
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  # IntelliJ 작업 디렉터리는 프로젝트 루트입니다. Alloy가 앱별 파일을 읽습니다.
  file:
    name: infra/monitoring/.local-logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 50MB
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: ${spring.application.name}
