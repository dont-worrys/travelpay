spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL}
    username: ${WALLET_DB_USERNAME}
    password: ${WALLET_DB_PASSWORD}
    hikari:
      # 트랜잭션 타임아웃은 커넥션을 얻은 뒤부터 적용되므로 획득 대기도 따로 제한
      connection-timeout: 2000
      validation-timeout: 1000
      # 트랜잭션마다 격리 수준을 지정하지 않고 커넥션을 만들 때 한 번 정한다 (@Transactional(isolation)은 트랜잭션마다 SHOW 조회가 생김).
      # 재조회에서 다른 트랜잭션이 커밋한 행을 봐야 하는 단계들이 이 값을 전제로 한다
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    default-schema: wallet_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cloud:
    openfeign:
      client:
        config:
          ledger-service:
            # 원장 최대 응답(약 5초)보다 길게
            connect-timeout: 1000
            read-timeout: 6000
          # 원장 거래 등록 클라이언트 (contextId로 설정 키가 나뉨). 계정 클라이언트와 같은 값
          ledger-transaction:
            connect-timeout: 1000
            read-timeout: 6000
          mock-bank:
            # 은행 응답이 이보다 늦으면 결과 모름으로 두고 같은 requestId로 다시 보낸다
            connect-timeout: 1000
            read-timeout: 5000
          user-service:
            # 실명 조회는 단건 조회라 짧게
            connect-timeout: 1000
            read-timeout: 2000
  task:
    scheduling:
      pool:
        # 복구·Outbox 발행·충전 대사가 각자 스레드를 쓴다 (외부 호출이 긴 배치가 다른 스케줄러를 막지 않게)
        size: 3
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # 발행기 트랜잭션(10초)보다 먼저 포기하도록 짧게
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        linger.ms: 5
        # Kafka가 꺼져 있으면 send() 자체가 기본 60초 멈춤 → 짧게 제한
        max.block.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 컨슈머 그룹이 처음 붙을 때 그 전에 쌓인 충전 이벤트도 처리
      auto-offset-reset: earliest

travelpay:
  auth:
    header-context:
      enabled: true
  wallet:
    # 계좌번호 AES-256-GCM 키 (Base64, 32바이트). 없으면 기동 실패
    account-number-key: ${WALLET_ACCOUNT_NUMBER_KEY}
    outbox:
      publisher:
        enabled: true
        fixed-delay: 1s
        batch-size: 50
    charge:
      saga:
        consumer:
          enabled: true
          concurrency: 1
      recovery:
        enabled: true
        fixed-delay: 10s
        batch-size: 10
      reconciliation:
        enabled: true
        fixed-delay: 10m
        grace: 5m
        overlap: 10m
        max-period: 1d
        running-timeout: 30m
        initial-from: "2026-11-01T00:00:00Z"
      resolution:
        not-found-confirm-after: 10m
  client:
    # ledger·user는 주소를 비우면 Eureka로 찾습니다.
    # bank는 Mock 은행이 Eureka에 등록되지 않아 MOCK_BANK_URL로 직접 주소를 받습니다(필수).
    # 은행 장애 주입(fault-injection)은 로컬 검증 전용이라 넣지 않는다
    bank:
      url: ${MOCK_BANK_URL}
      # 은행 코드별 서킷 브레이커 (출금·환불만, 거래 조회는 거치지 않음). 값이 없거나 범위를 벗어나면 기동 실패
      # 느린 호출 판정은 쓰지 않으며 코드에서 끈다 (BankCircuitBreakerConfig 참고)
      circuit-breaker:
        # 최근 호출 5건(최소 5건 모인 뒤)이 모두 결과 모름이면 연다. 업무 거절(FAILED)·응답 이상(4xx 등)은 실패로 세지 않는다
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        # 열린 뒤 이 시간 동안 보내지 않고, 지나면 자동으로 반열림
        wait-duration-in-open-state: 10s
        # 반열림에서 시험으로 보낼 호출 수
        permitted-number-of-calls-in-half-open-state: 1
    ledger:
      url: ${LEDGER_SERVICE_URL:}
    user:
      url: ${USER_SERVICE_URL:}

server:
  port: 8080

# 운영에서는 API 문서를 노출하지 않습니다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

eureka:
  instance:
    hostname: wallet-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}