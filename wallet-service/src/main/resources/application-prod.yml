spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL}
    username: ${WALLET_DB_USERNAME}
    password: ${WALLET_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

travelpay:
  auth:
    header-context:
      enabled: true
  wallet:
    # 계좌번호 AES-256-GCM 키 (Base64, 32바이트). 없으면 기동 실패
    account-number-key: ${WALLET_ACCOUNT_NUMBER_KEY}

server:
  port: 8080

eureka:
  instance:
    hostname: wallet-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
