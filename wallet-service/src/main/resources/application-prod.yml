spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL}
    username: ${WALLET_DB_USERNAME}
    password: ${WALLET_DB_PASSWORD}
    hikari:
      # 트랜잭션 타임아웃은 커넥션을 얻은 뒤부터 적용되므로 획득 대기도 따로 제한
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    default-schema: wallet_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cloud:
    openfeign:
      client:
        config:
          ledger-service:
            # 원장 최대 응답(약 5초)보다 길게
            connect-timeout: 1000
            read-timeout: 6000
          # 원장 거래 등록 클라이언트 (contextId로 설정 키가 나뉨). 계정 클라이언트와 같은 값
          ledger-transaction:
            connect-timeout: 1000
            read-timeout: 6000
          mock-bank:
            # 은행 응답이 이보다 늦으면 결과 모름으로 두고 같은 requestId로 다시 보낸다
            connect-timeout: 1000
            read-timeout: 5000
          user-service:
            # 실명 조회는 단건 조회라 짧게
            connect-timeout: 1000
            read-timeout: 2000
  task:
    scheduling:
      pool:
        # 기본 1스레드면 복구 배치(외부 호출)가 길어질 때 Outbox 발행이 막힌다
        size: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # 발행기 트랜잭션(10초)보다 먼저 포기하도록 짧게
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        linger.ms: 5
        # Kafka가 꺼져 있으면 send() 자체가 기본 60초 멈춤 → 짧게 제한
        max.block.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 컨슈머 그룹이 처음 붙을 때 그 전에 쌓인 충전 이벤트도 처리
      auto-offset-reset: earliest

travelpay:
  auth:
    header-context:
      enabled: true
  wallet:
    # 계좌번호 AES-256-GCM 키 (Base64, 32바이트). 없으면 기동 실패
    account-number-key: ${WALLET_ACCOUNT_NUMBER_KEY}
    outbox:
      publisher:
        enabled: true
        fixed-delay: 1s
        batch-size: 50
    charge:
      saga:
        consumer:
          enabled: true
      recovery:
        enabled: true
        fixed-delay: 10s
        batch-size: 10
  client:
    # 배포는 Eureka에서 서비스 이름으로 찾으므로 주소를 비워 둔다
    # 은행 장애 주입(fault-injection)은 로컬 검증 전용이라 넣지 않는다
    bank:
      url: ${MOCK_BANK_URL}
    ledger:
      url: ${LEDGER_SERVICE_URL:}
    user:
      url: ${USER_SERVICE_URL:}

server:
  port: 8080

eureka:
  instance:
    hostname: wallet-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}